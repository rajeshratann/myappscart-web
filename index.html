<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyAppsCart – Mobile Apps</title>
  <meta name="description" content="MyAppsCart – a collection of mobile games and apps built with passion." />
  <style>
    :root {
      --primary: #5B7CFA;
      --bg: #f5f6ff;
      --surface: #ffffff;
      --text: #1B1F2A;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 48px 24px 40px;
      text-align: center;
    }
    header .logo { font-size: 52px; margin-bottom: 12px; }
    header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
    header p { margin-top: 8px; font-size: 15px; opacity: 0.85; }
    main {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      width: 100%;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .app-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform .15s, box-shadow .15s;
    }
    .app-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(91,124,250,0.15); }
    .app-card .app-icon { font-size: 40px; margin-bottom: 14px; }
    .app-card h2 { font-size: 17px; font-weight: 800; }
    .app-card p { font-size: 13px; color: var(--muted); margin-top: 6px; flex: 1; }
    .app-card .arrow {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }
    footer {
      background: #1B1F2A;
      color: #9ca3af;
      text-align: center;
      padding: 24px;
      font-size: 13px;
    }
    footer a { color: #9ca3af; text-decoration: none; }
    footer a:hover { color: #fff; }
  </style>
</head>
<body>

<header>
  <div class="logo">🛒</div>
  <h1>MyAppsCart</h1>
  <p>Mobile apps &amp; games built with passion.</p>
</header>

<main>
  <p class="section-title">Our Apps</p>
  <div class="apps-grid">

    <a class="app-card" href="/game/bb/">
      <div class="app-icon">🧠⚡</div>
      <h2>Brain Battle</h2>
      <p>Four brain games — Word Connect, Number Puzzle, Memory Match &amp; Color Challenge. 10,000+ levels.</p>
      <div class="arrow">View App →</div>
    </a>

    <!-- Future apps go here — copy the card block above -->

  </div>
</main>

<footer>
  <p>&copy; 2026 MyAppsCart &nbsp;·&nbsp; <a href="mailto:support@myappscart.com">support@myappscart.com</a></p>
</footer>

</body>
</html>
