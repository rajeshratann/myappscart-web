<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyAppsCart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f6ff;
      color: #1B1F2A;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 32px; font-weight: 800; color: #5B7CFA; }
    p { margin-top: 10px; color: #6b7280; font-size: 16px; }
    .apps { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
    .app-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-decoration: none;
      color: inherit;
      transition: transform .15s;
    }
    .app-card:hover { transform: translateY(-3px); }
    .app-card .icon { font-size: 36px; }
    .app-card h2 { font-size: 16px; margin-top: 8px; font-weight: 700; }
    .app-card .link { font-size: 12px; color: #5B7CFA; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="logo">🛒</div>
  <h1>MyAppsCart</h1>
  <p>Mobile apps built with passion.</p>

  <div class="apps">
    <a class="app-card" href="/game/bb/policy.html">
      <div class="icon">🧠⚡</div>
      <h2>Brain Battle</h2>
      <div class="link">Privacy Policy →</div>
    </a>
  </div>
</body>
</html>
