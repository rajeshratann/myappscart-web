<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — MyAppsCart</title>
  <script>
    // ChandaKhata join links (myappscart.com/j/CODE) open the app when it is
    // installed; otherwise the browser lands here and goes to the join page.
    (function () {
      var m = location.pathname.match(/^\/j\/([A-Za-z0-9]{6})\/?$/);
      if (m) location.replace('https://chandakhata.web.app/j/' + m[1]);
    })();
  </script>
  <style>
    :root { --bg: #fffaf5; --fg: #2b1a10; --muted: #7a6455; --accent: #c2410c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1410; --fg: #f5ebe3; --muted: #b9a596; --accent: #fb923c; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; padding: 16px; }
    a { color: var(--accent); font-weight: 600; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you were looking for isn't here.</p>
    <p><a href="/">Go to MyAppsCart</a></p>
  </main>
</body>
</html>
